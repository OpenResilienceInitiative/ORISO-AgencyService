openapi: 3.0.1
info:
  title: will be replaced
  description: This information will be replaced by the SpringFox config information
  version: 0.0.1
paths:
  /agencies:
    get:
      tags:
        - agency-controller
      summary: 'Returns a randomly sorted list of agencies. If no agency is found the white spot
        agency id is being returned. When no white spot agency is defined No Content
        is being returned. [Authorization: none]'
      operationId: getAgencies
      parameters:
        - name: postcode
          in: query
          required: false
          description: The postcode the user entered
          schema:
            type: string
            minLength: 5
            maxLength: 5
            example: "56789"
        - name: consultingType
          in: query
          required: true
          description: The consulting type of the registration form
          schema:
            type: integer
            format: int32
            example: 5
        - name: topicId
          in: query
          required: false
          description: The main topic of the registration form
          schema:
            type: integer
            format: int32
            example: 7
        - name: age
          in: query
          required: false
          description: Age from the registration form
          schema:
            type: integer
            format: int32
            example: 27
        - name: gender
          in: query
          required: false
          description: Gender from the registration form
          schema:
            type: string
            example: "FEMALE"
        - name: counsellingRelation
          in: query
          required: false
          description: Counselling relation from the registration form
          schema:
            type: string
            example: "PARENTAL_COUNSELLING"
      responses:
        200:
          description: OK - successfull operation
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FullAgencyResponseDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        403:
          description: FORBIDDEN - no/invalid CSRF token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/by-tenant:
    get:
      tags:
        - agency-controller
      summary: 'Returns a list of agencies from a specific tenant (retrieved from the security context).
       The security context is retrieved from the bearer token, so it is not passed as a request parameter.
       If no agency is found No Content is being returned. [Authorization: none]'
      operationId: getTenantAgencies
      parameters:
        - name: postcode
          in: query
          required: true
          description: The postcode the user entered
          schema:
            type: string
            minLength: 5
            maxLength: 5
            example: "56789"
        - name: topicId
          in: query
          required: true
          description: The main topic of the registration form
          schema:
            type: integer
            format: int32
            example: 7
      responses:
        200:
          description: OK - successfull operation
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FullAgencyResponseDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        403:
          description: FORBIDDEN - no/invalid CSRF token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/topics:
    get:
      tags:
        - agency-controller
      summary: 'Returns a list of all the topics assigned to all the agencies of a specific tenant'
      operationId: getAgenciesTopics
      responses:
        200:
          description: OK - successfull operation
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyTopicsDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        403:
          description: FORBIDDEN - no/invalid CSRF token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/{agencyIds}:
    get:
      tags:
        - agency-controller
      summary: 'Returns the information of provided agencies (Ids) including settings. [Authorization: none]'
      operationId: getAgenciesByIds
      parameters:
        - name: agencyIds
          in: path
          description: List of comma-seperated Agency IDs
          required: true
          style: simple
          explode: false
          schema:
            type: array
            items:
              type: integer
              format: int64
              example: 20
      responses:
        200:
          description: OK - successfull operation
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyResponseDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        403:
          description: FORBIDDEN - no/invalid CSRF token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/{agencyId}/topics/{topicId}/legal:
    get:
      tags:
        - agency-controller
      summary: 'Returns the published legal texts (data privacy policy and imprint) of a
        department (agency x topic). Draft or never-authored texts are returned as null content -
        drafts are never exposed to users. [Authorization: none]'
      operationId: getDepartmentLegal
      parameters:
        - name: agencyId
          in: path
          description: Agency Id
          required: true
          schema:
            type: integer
            format: int64
        - name: topicId
          in: path
          description: Topic Id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        200:
          description: OK - successfull operation
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/DepartmentLegalDTO'
        404:
          description: NOT FOUND - department (agency x topic) not found
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition
  /agencies/consultingtype/{consultingTypeId}:
    get:
      tags:
        - agency-controller
      summary: 'Returns all agencies for provided consulting type. [Authorization: none]'
      operationId: getAgenciesByConsultingType
      parameters:
        - name: consultingTypeId
          in: path
          description: the consulting type id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: OK - successfull operation
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgencyResponseDTO'
        400:
          description: BAD REQUEST - invalid/incomplete request or body object
        403:
          description: FORBIDDEN - no/invalid CSRF token
        500:
          description: INTERNAL SERVER ERROR - server encountered unexpected condition

components:
  schemas:
    AgencyResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 684
        name:
          type: string
          example: "Suchtberatung Freiburg"
        postcode:
          type: string
          example: "79106"
        city:
          type: string
          example: "Bonn"
        description:
          type: string
          example: "Our agency provides help for the following topics: Lorem ipsum.."
        teamAgency:
          type: boolean
          example: "false"
        offline:
          type: boolean
          example: "false"
        consultingType:
          type: integer
          example: 0
        tenantId:
          type: integer
          format: int64
          example: 12
        agencySpecificPrivacy:
          type: string
          example: "specific for agency privacy text"
        topicIds:
          type: array
          items:
            type: integer
            format: int64
        agencyLogo:
          type: string
          example: "base64 encoded image"
        street:
          type: string
          example: "Musterstraße"
        houseNumber:
          type: string
          example: "12a"
        phone:
          type: string
          example: "+49 30 1234567"
        openingHours:
          type: string
          example: "Mo-Fr 9-17 Uhr"
        departments:
          type: array
          description: The agency's departments (one per assigned topic) with the publication
            state of their own legal texts. Optional - older clients can ignore it.
          items:
            $ref: '#/components/schemas/AgencyDepartmentDTO'
        settings:
          $ref: '#/components/schemas/Settings'

    FullAgencyResponseDTO:
      type: object
      allOf:
        - $ref: '#/components/schemas/AgencyResponseDTO'
        - type: object
          properties:
            demographics:
              $ref: '#/components/schemas/DemographicsDTO'
            url:
              type: string
              example: http://www.domain.com/agency
            external:
              type: boolean
              example: "false"

    AgencyDepartmentDTO:
      type: object
      properties:
        topicId:
          type: integer
          format: int64
          example: 7
        hasPublishedDpp:
          type: boolean
          description: true if the department has a published data privacy policy of its own
          example: true
        hasPublishedImprint:
          type: boolean
          description: true if the department has a published imprint of its own
          example: false

    DepartmentLegalDTO:
      type: object
      required:
        - dpp
        - imprint
      properties:
        dpp:
          $ref: '#/components/schemas/DepartmentLegalContentDTO'
        imprint:
          $ref: '#/components/schemas/DepartmentLegalContentDTO'

    DepartmentLegalContentDTO:
      type: object
      properties:
        content:
          type: string
          nullable: true
          description: Published multilingual content as a JSON language->HTML map string;
            null when the text is a draft or was never authored (drafts are never exposed)

    AgencyTopicsDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 684
        name:
          type: string
          example: "Adoption and fostering a child"

    DemographicsDTO:
      type: object
      properties:
        ageFrom:
          type: integer
          minimum: 0
          maximum: 200
          example: 25
        ageTo:
          type: integer
          minimum: 0
          maximum: 200
          example: 55
        genders:
          type: array
          items:
            type: string
          example: "[MALE,FEMALE,DIVERS]"

    AgencyAdminAllowedPermissionToggles:
      $ref: './components/agency-settings.yaml#/components/schemas/AgencyAdminAllowedPermissionToggles'
    AgencyAdminControls:
      $ref: './components/agency-settings.yaml#/components/schemas/AgencyAdminControls'
    Settings:
      $ref: './components/agency-settings.yaml#/components/schemas/Settings'

  securitySchemes:
    Bearer:
      type: apiKey
      name: Authorization
      in: header
