name: AgencyService Branch Validation

on:
  push:
    branches-ignore:
    - main
    - dev
    - pre-dev

jobs:
  validate:
    name: test and build AgencyService
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run AgencyService tests and build
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

  required-integration-tests:
    name: required integration tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run deterministic integration contract
      uses: ./.github/actions/maven-verify-required
      with:
        java_version: '21'


  # Was the #185 quarantine, tolerated red until 2026-09-30. Retired on
  # 2026-09-19: all seven sub-issues are closed and the suite ran green three
  # consecutive times on dev (67b90676, 3c08a731, 5aace67c). It blocks now,
  # which is what the deadline was there to force.
  full-integration-suite:
    name: full integration suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run full legacy integration suite
      uses: ./.github/actions/maven-verify-burnin
      with:
        java_version: '21'
