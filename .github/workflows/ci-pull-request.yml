name: AgencyService PR Validation

on:
  pull_request:

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative

jobs:
  validate:
    name: test, build and Docker validation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run AgencyService tests and build
      uses: ./.github/actions/maven-build
      with:
        java_version: '21'

    - name: Docker build validation without publishing
      uses: ./.github/actions/docker-build-push
      with:
        push_to_ghcr: false
        image_name: oriso-agencyservice
        github_token: ${{ secrets.GITHUB_TOKEN }}

  required-integration-tests:
    name: required integration tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run deterministic integration contract
      uses: ./.github/actions/maven-verify-required
      with:
        java_version: '21'


  full-integration-suite:
    name: full integration suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Run full legacy integration suite
      uses: ./.github/actions/maven-verify-burnin
      with:
        java_version: '21'

  contract-tests:
    name: CI contract tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install pinned test dependencies
      run: python -m pip install --disable-pip-version-check pytest==9.0.2

    - name: Verify the required-CI contract holds
      run: python -m pytest -q tests/ci

  required-ci:
    name: required CI
    if: always()
    needs: [validate, required-integration-tests, contract-tests, full-integration-suite]
    runs-on: ubuntu-latest

    steps:
    - name: Report the aggregate required conclusion
      env:
        VALIDATE_RESULT: ${{ needs.validate.result }}
        CONTRACT_RESULT: ${{ needs.contract-tests.result }}
        INTEGRATION_RESULT: ${{ needs.required-integration-tests.result }}
        FULL_SUITE_RESULT: ${{ needs.full-integration-suite.result }}
      run: |
        conclusion=success
        if [[ "${VALIDATE_RESULT}" != success || "${INTEGRATION_RESULT}" != success \
           || "${CONTRACT_RESULT}" != success || "${FULL_SUITE_RESULT}" != success ]]; then
          conclusion=failure
        fi
        if [[ "${conclusion}" != success ]]; then
          echo "::error::Required CI failed: validate=${VALIDATE_RESULT}, integration=${INTEGRATION_RESULT}, contract=${CONTRACT_RESULT}, full-suite=${FULL_SUITE_RESULT}"
          exit 1
        fi

  # Non-blocking OpenAPI contract diff: flags breaking changes to this service's
  # own vendored specs (api/*.yaml) between the PR base and head. Informational
  # during burn-in; flip to blocking once the process around intentional breaking
  # changes (version bump / consumer sign-off) is agreed.
  api-contract-diff:
    name: api-contract-diff (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout PR head
      uses: actions/checkout@v6

    - name: Checkout base branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.base_ref }}
        path: .base

    - name: Diff own OpenAPI specs against base (oasdiff breaking)
      shell: bash
      run: |
        shopt -s nullglob
        status=0
        for spec in api/*.yaml api/*.yml; do
          if [ -f ".base/$spec" ]; then
            echo "::group::oasdiff breaking $spec"
            docker run --rm -v "$PWD:/work:ro" tufin/oasdiff:latest \
              breaking "/work/.base/$spec" "/work/$spec" --fail-on WARN || status=1
            echo "::endgroup::"
          else
            echo "Skipping $spec (new on this branch, nothing to diff against)"
          fi
        done
        if [ "$status" -ne 0 ]; then
          echo "::warning::oasdiff found (formally) breaking API spec changes - report-only; see the log groups above. Flip to a hard failure once the breaking-change process is agreed."
          echo "### api-contract-diff: breaking changes detected (report-only)" >> "$GITHUB_STEP_SUMMARY"
        fi
