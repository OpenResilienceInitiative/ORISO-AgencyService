name: Reusable legacy integration-test quarantine

# Time-bounded quarantine owned by #185 and expiring 2026-09-30.
# Runs the full `verify` lifecycle so the surefire `integration-tests` execution
# (bound to the integration-test phase, includes **/*IT.*) actually runs. These
# integration tests have never run in CI before (local burn-in 2026-07-07:
# 23 IT classes, 7 green / 16 red — mostly context-load errors), so this action
# is wired into an explicit non-blocking job. Maven's failure is propagated;
# the calling job alone owns the quarantine. `-fae` keeps the report set
# complete.

inputs:
  java_version:
    required: true

runs:
  using: 'composite'
  steps:
  - name: Set up JDK and Maven
    uses: actions/setup-java@v5
    with:
      java-version: ${{ inputs.java_version }}
      distribution: 'temurin'
      cache: maven

  - name: Run Maven verify (legacy quarantine)
    id: legacy_verify
    shell: bash
    # -fae (fail-at-end) lets every module/execution run so the report set is
    # complete. Maven's exit code is NOT suppressed here: the step goes red on
    # failure and the calling job declares the quarantine with a job-level
    # continue-on-error, so the non-blocking scope is visible in the workflow
    # file instead of hidden inside this action.
    run: ./mvnw -B -fae verify

  - name: Record the quarantined Maven outcome
    if: ${{ always() }}
    shell: bash
    env:
      LEGACY_VERIFY_OUTCOME: ${{ steps.legacy_verify.outcome }}
    run: |
      echo "Legacy integration outcome: ${LEGACY_VERIFY_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
      if [[ "${LEGACY_VERIFY_OUTCOME}" != success ]]; then
        echo "::warning::Legacy integration failures are quarantined by #185 until 2026-09-30."
      fi

  - name: Reject incomplete legacy test reports
    if: ${{ always() }}
    shell: bash
    # The shared guard treats zero reports, zero executed tests, failures, errors,
    # and skips as red. The calling workflow still owns the explicit, time-bounded
    # continue-on-error quarantine; strict report truth does not make this suite blocking.
    run: |
      shopt -s nullglob globstar
      reports=( **/target/surefire-reports/TEST-*.xml **/target/failsafe-reports/TEST-*.xml )
      python3 scripts/ci/verify-test-reports.py "${reports[@]}"

  - name: Summarise legacy integration-test results
    if: ${{ always() }}
    shell: bash
    run: |
      python3 - <<'PY'
      from pathlib import Path
      import xml.etree.ElementTree as ET

      total_tests = total_failures = total_errors = total_skipped = 0
      failing = []
      for report in Path(".").glob("**/target/surefire-reports/TEST-*.xml"):
          try:
              root = ET.parse(report).getroot()
          except ET.ParseError:
              continue
          tests = int(root.attrib.get("tests", 0))
          failures = int(root.attrib.get("failures", 0))
          errors = int(root.attrib.get("errors", 0))
          skipped = int(root.attrib.get("skipped", 0))
          total_tests += tests
          total_failures += failures
          total_errors += errors
          total_skipped += skipped
          if failures or errors:
              failing.append((report, failures, errors))

      print(f"Legacy integration quarantine: tests={total_tests} "
            f"failures={total_failures} errors={total_errors} skipped={total_skipped}")
      if failing:
          print("Quarantined reports with failures/errors:")
          for report, failures, errors in sorted(failing):
              print(f"- {report}: failures={failures}, errors={errors}")
      PY

  - name: Upload test reports
    if: ${{ always() }}
    uses: actions/upload-artifact@v4
    with:
      name: integration-test-reports-${{ inputs.java_version }}
      path: |
        **/target/surefire-reports/*.xml
        **/target/failsafe-reports/*.xml
      if-no-files-found: warn
      retention-days: 7
