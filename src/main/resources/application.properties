# ---------------- General ----------------
spring.application.name=agency-service
spring.profiles.active=@activeSpringProfile@
spring.main.allow-bean-definition-overriding=true
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=none
spring.data.jpa.repositories.bootstrap-mode=default
spring.main.banner-mode=off
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration

# ---------------- Sentry ----------------
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:dev}
sentry.release=${SENTRY_RELEASE:oriso-agencyservice@local}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}
sentry.send-default-pii=${SENTRY_SEND_DEFAULT_PII:false}
sentry.logging.minimum-event-level=${SENTRY_LOGGING_MINIMUM_EVENT_LEVEL:warn}
sentry.logging.minimum-breadcrumb-level=${SENTRY_LOGGING_MINIMUM_BREADCRUMB_LEVEL:info}

# ---------------- Server ----------------
server.port=8084
server.host=http://localhost
app.base.url=http://localhost:8084

# ---------------- Matrix Synapse ----------------
# Use Kubernetes DNS names, e.g., http://matrix-synapse.caritas.svc.cluster.local:8008
# NOT hardcoded IPs like http://203.0.113.10:8008
matrix.api-url=${MATRIX_API_URL:}
matrix.registration-shared-secret=${MATRIX_REGISTRATION_SHARED_SECRET:}
matrix.server-name=${MATRIX_SERVER_NAME:}
matrix.admin-username=${MATRIX_ADMIN_USERNAME:}
matrix.admin-password=${MATRIX_ADMIN_PASSWORD:}

# ---------------- Encryption (agency Matrix passwords at rest, AS-C01) ----------------
service.encryption.appkey=${SERVICE_ENCRYPTION_APPKEY:}

# ---------------- CORS ----------------
registration.cors.allowed.origins=
registration.cors.allowed.paths=
agency.cors.enabled=${AGENCY_CORS_ENABLED:false}
agency.cors.allowed.origins=${AGENCY_CORS_ALLOWED_ORIGINS:}
agency.cors.allowed.paths=${AGENCY_CORS_ALLOWED_PATHS:/**}

spring.web.locale=de_DE
spring.jackson.time-zone=Europe/Berlin

# ---------------- API Docs ----------------
springfox.docuTitle=Caritas Online Beratung: AgencyService
springfox.docuDescription=Provides a REST API service to provide user information and actions.
springfox.docuVersion=0.0.1
springfox.docuTermsUrl=
springfox.docuContactName=
springfox.docuContactUrl=
springfox.docuContactEmail=
springfox.docuLicense=Apache 2.0
springfox.docuLicenseUrl=http://www.apache.org/licenses/LICENSE-2.0.html
springfox.docuPath=/agencies/docs

# ---------------- App Service URLs ----------------
agency.service.api.url=${app.base.url}/service
agency.service.api.get.agencies=${agency.service.api.url}/
agency.admin.service.api.url=${app.base.url}
# Use Kubernetes DNS names, e.g., http://consultingtypeservice.caritas.svc.cluster.local:8083
consulting.type.service.api.url=${CONSULTING_TYPE_SERVICE_API_URL:}
appointment.service.api.url=${APPOINTMENT_SERVICE_API_URL:}
tenant.service.api.url=${TENANT_SERVICE_API_URL:}

# ---------------- Cache ----------------
cache.agencies.configuration.maxEntriesLocalHeap=100
cache.agencies.configuration.eternal=false
cache.agencies.configuration.timeToIdleSeconds=0
cache.agencies.configuration.timeToLiveSeconds=10800

cache.consulting.type.configuration.maxEntriesLocalHeap=100
cache.consulting.type.configuration.eternal=false
cache.consulting.type.configuration.timeToIdleSeconds=0
cache.consulting.type.configuration.timeToLiveSeconds=86400

cache.tenant.configuration.maxEntriesLocalHeap=100
cache.tenant.configuration.eternal=false
cache.tenant.configuration.timeToIdleSeconds=0
cache.tenant.configuration.timeToLiveSeconds=86400

cache.topic.configuration.maxEntriesLocalHeap=100
cache.topic.configuration.eternal=false
cache.topic.configuration.timeToIdleSeconds=0
cache.topic.configuration.timeToLiveSeconds=60

cache.appsettings.configuration.maxEntriesLocalHeap=100
cache.appsettings.configuration.eternal=false
cache.appsettings.configuration.timeToIdleSeconds=0
cache.appsettings.configuration.timeToLiveSeconds=60
cache.applicationsettings.configuration.maxEntriesLocalHeap=100
cache.applicationsettings.configuration.eternal=false
cache.applicationsettings.configuration.timeToIdleSeconds=0
cache.applicationsettings.configuration.timeToLiveSeconds=60

# ---------------- Keycloak ----------------
# Use Kubernetes DNS names, e.g., http://keycloak.caritas.svc.cluster.local:8080
# NOT hardcoded IPs like http://203.0.113.20:8080
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:}
keycloak.realm=${KEYCLOAK_REALM:}
keycloak.bearer-only=true
keycloak.resource=agency-service
keycloak.principal-attribute=preferred_username
keycloak.cors=false
keycloak.config.admin-username=${KEYCLOAK_CONFIG_ADMIN_USERNAME:}
keycloak.config.admin-password=${KEYCLOAK_CONFIG_ADMIN_PASSWORD:}
keycloak.config.admin-client-id=admin-cli
keycloak.config.app-client-id=app

# ---------------- MariaDB ----------------
# Configuration must be provided via ConfigMap/Secrets (environment variables)
# Use Kubernetes DNS names, e.g., jdbc:mariadb://mariadb.caritas.svc.cluster.local:3306/agencyservice
# NOT hardcoded IPs like jdbc:mariadb://203.0.113.30:3306/agencyservice
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=8
spring.datasource.hikari.idle-timeout=500000
spring.datasource.hikari.maxLifetime=500000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate

# ---------------- Liquibase ----------------
# Single consolidated master (Liquibase Re-Enablement Plan 2026-07-04, package L1).
# Kill switch SPRING_LIQUIBASE_ENABLED defaults to true; cluster ConfigMaps still force it
# to false until Helm package L3 lands, so there is no runtime behaviour change on merge.
# Per-environment changeset selection is done via spring.liquibase.contexts in each
# application-<profile>.properties (local/dev: seed; staging/prod: none).
spring.liquibase.change-log=classpath:db/changelog/agencyservice-master.xml
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}

# ---------------- Appointments & Features ----------------
appointments.delete-job-cron=0 0 0 * * ?
appointments.delete-job-enabled=false
appointments.lifespan-in-hours=24
agency.deleteworkflow.cron=${AGENCY_DELETEWORKFLOW_CRON:0 0 3 * * ?}
feature.topics.enabled=true
feature.demographics.enabled=false
feature.appointment.enabled=false
feature.multitenancy.with.single.domain.enabled=${FEATURE_MULTITENANCY_WITH_SINGLE_DOMAIN_ENABLED:false}
multitenancy.enabled=${MULTITENANCY_ENABLED:false}

# ---------------- ADR-003 department / DPO contact ----------------
# The data protection officer contact is a legal imprint/DPP requirement (ADR-003) and is
# MANDATORY in production (this default). The testing/local/dev profiles override it to false
# ("dev mode", decided in #oriso-codereview) so tests and dev flows can create agencies without
# a fully populated DPO contact. Enforcement is application-layer; the DB column is nullable.
agency.department.require-dpo-contact=${AGENCY_DEPARTMENT_REQUIRE_DPO_CONTACT:true}


# ---------------- Actuator ----------------
management.endpoint.health.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoints.web.exposure.include=health,loggers
management.endpoint.health.probes.enabled=true
management.endpoint.loggers.enabled=true

# ---------------- OpenTelemetry / OTLP (SigNoz traces + metrics) ----------------
# Replaces the old Zipkin exporter, which had no Zipkin agent to talk to anywhere
# (ORISO-AGENCYSERVICE-1: ResourceAccessException, Connection refused, localhost:9411,
# 13,284 Sentry events - the loudest error in this service's history).
#
# Empty-string endpoints alone are NOT a clean no-op: verified empirically that Spring Boot
# 4's OTLP autoconfiguration defaults *.export.enabled=true and falls back to
# http://localhost:4318 when no endpoint is configured, so it would keep trying to export in
# the background wherever these env vars aren't set (local/test/any env without a collector) -
# the same class of problem as the Zipkin bug this replaces. Gate export explicitly with the
# boolean toggles below instead, defaulting to disabled.
#
# Property names: `management.otlp.tracing.*` looked plausible (metrics uses that exact
# prefix) and produced no startup error, which is what made it easy to mistake for "working" -
# but it's a level=error-deprecated alias in Spring Boot 4.0.1 that is never actually bound
# without spring-boot-properties-migrator on the classpath (which we don't have), so it was
# silently inert regardless of value. Confirmed against OtlpTracingProperties.java /
# ConditionalOnEnabledTracingExport javadoc at the v4.0.1 tag. The real, live property names:
management.opentelemetry.tracing.export.otlp.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:}
management.tracing.export.otlp.enabled=${MANAGEMENT_OTLP_TRACING_ENABLED:false}
management.otlp.metrics.export.url=${MANAGEMENT_OTLP_METRICS_EXPORT_URL:}
management.otlp.metrics.export.enabled=${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}

# ---------------- Thread / Task Executor ----------------
thread.executor.corePoolSize=10
thread.executor.maxPoolSize=15
thread.executor.queueCapacity=500
thread.executor.threadNamePrefix=AgencyService-

# Use Kubernetes DNS names, e.g., http://userservice.caritas.svc.cluster.local:8082
user.admin.service.api.url=${USER_ADMIN_SERVICE_API_URL:}

# ---------------- CSRF ----------------
csrf.header.property=X-CSRF-Token
csrf.cookie.property=CSRF-TOKEN
csrf.whitelist.adminUris=
csrf.whitelist.configUris=
csrf.whitelist.header.property=
